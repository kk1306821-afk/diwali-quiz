      -webkit-background-clip: text;

    .diya-flicker {
      display: inline-block;

      transform-origin: bottom center;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 6px #ff9900); }

    }

      100% {

      }

      }

    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const label = document.getElementById('soundLabel');
      if (soundEnabled) {
        initAudio();
        icon.textContent = '🔊';
        label.textContent = 'Sound ON';
        playTone(660, 0.12, 'sine');
      } else {
        icon.textContent = '🔇';
        label.textContent = 'Sound OFF';
      }
    }

    function playTone(freq, duration = 0.15, type = 'triangle', delay = 0) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

        gain.gain.setValueAtTime(0.14, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {
        // Ignore audio errors on restricted browsers
      }
    }

    function playClickChime() {

    }

    function playFireworkPop() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 0.18;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.04));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 900 + Math.random() * 900;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

          >
            <span>${opt.label}</span>
            <span class="text-amber-300/70 group-hover:text-purple-950 text-sm font-bold transition">→</span>
          </button>
        `
        )
        .join('');

      const html = `
        <!-- Top Player & Progress Bar -->
        <div class="mb-5">
          <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-amber-200/90 mb-2">
            <span class="bg-amber-400/15 border border-amber-400/30 px-3 py-1 rounded-full">
              🎉 ${escapeHtml(playerName)}
            </span>
            <span class="text-amber-300 font-bold">
              Question ${currentQuestionIndex + 1} of ${total}
            </span>
          </div>

          <!-- Progress Track with Moving Diya -->
          <div class="w-full h-3 bg-black/50 rounded-full p-0.5 border border-amber-400/30 relative overflow-visible">
            <div
              class="h-full rounded-full bg-gradient-to-r from-orange-500 via-amber-400 to-yellow-300 transition-all duration-500 relative"
              style="width: ${progressPercent}%"
            >
              <span class="absolute -right-2.5 -top-3 text-base diya-flicker">🪔</span>
            </div>
          </div>
        </div>

        <!-- Question Tag & Emoji -->
        <div class="inline-block bg-rose-500/25 border border-rose-400/40 text-rose-200 text-xs font-bold uppercase tracking-wider px-3.5 py-1 rounded-full mb-2">
          ${q.tag}
        </div>
        <div class="text-4xl sm:text-5xl mb-2">${q.emoji}</div>

        <!-- Question Text -->
        <h2 class="text-xl sm:text-2xl font-bold text-white leading-snug mb-6">
          ${q.question}
        </h2>

        <!-- Options List -->
        <div class="space-y-3">
          ${optionsHtml}
        </div>
      `;

      animateCardSwap(html);
    }

    let isTransitioning = false;
    function selectOption(chosenValue, btnElement) {
      if (isTransitioning) return;
      isTransitioning = true;

      // Highlight selected button
      if (btnElement) {
        btnElement.classList.add('selected');
      }
      playClickChime();

      const currentQ = quizQuestions[currentQuestionIndex];
      userAnswers.push({
        tag: currentQ.tag,
        emoji: currentQ.emoji,
        question: currentQ.question,
        answer: chosenValue
      });

      setTimeout(() => {
        isTransitioning = false;
        if (currentQuestionIndex < quizQuestions.length - 1) {
          currentQuestionIndex++;
          renderQuestion();
        } else {
          renderFinale();
        }
      }, 320);
    }

    function calculateTopPick() {
      const counts = {};
      userAnswers.forEach((item) => {
        counts[item.answer] = (counts[item.answer] || 0) + 1;
      });

      let topMember = 'Sab';
      let maxCount = 0;
      for (const [member, count] of Object.entries(counts)) {
        if (count > maxCount) {
          maxCount = count;
          topMember = member;
        }
      }
      return { topMember, maxCount, counts };
    }

    function renderFinale() {
      playFanfare();
      startFireworks();

      const { topMember, maxCount } = calculateTopPick();
      const profile = familyTitles[topMember] || familyTitles.Sab;

      const summaryListHtml = userAnswers
        .map(
          (item, i) => `
          <div class="flex items-center justify-between bg-black/35 border border-amber-400/20 rounded-xl px-3.5 py-2 text-left text-xs sm:text-sm">
            <span class="text-amber-100/90 truncate pr-2">
              <strong class="text-amber-300">Q${i + 1}.</strong> ${item.emoji} ${item.tag}
            </span>
            <span class="shrink-0 bg-amber-400/20 text-amber-200 font-bold px-2.5 py-0.5 rounded-lg border border-amber-400/30">
              ${escapeHtml(item.answer)}
            </span>
          </div>
        `
        )
        .join('');

      const html = `
        <div class="text-4xl sm:text-5xl mb-2 flex justify-center gap-2">
          <span>🎆</span>
          <span class="diya-flicker">🪔</span>
          <span>🎇</span>
        </div>

        <h1 class="festive-title text-3xl sm:text-5xl gold-gradient-text mb-1">
          ✨ HAPPY DIWALI ✨
        </h1>

        <p class="text-amber-200 text-sm sm:text-base font-medium mb-4">
          Heartfelt Diwali Wishes To <span class="text-white font-bold underline decoration-amber-400">${escapeHtml(playerName)}</span> &amp; Your Entire Family! ❤️
        </p>

        <!-- Personalized Family Report Card Box -->
        <div class="bg-gradient-to-br from-amber-500/20 via-rose-500/15 to-purple-900/40 border-2 border-amber-400/60 rounded-2xl p-4 sm:p-5 mb-5 shadow-inner">
          <div class="text-xs uppercase tracking-widest text-amber-300 font-bold mb-1">
            📜 Official Family Report Card
          </div>
          <div class="text-lg sm:text-xl font-extrabold text-white mb-1.5">
            ${profile.badge}
          </div>
          <p class="text-xs sm:text-sm text-amber-100/90 leading-relaxed mb-2">
            ${profile.subtitle}
          </p>
          <div class="inline-block bg-black/40 text-amber-300 text-xs font-semibold px-3 py-1 rounded-full border border-amber-400/30">
            Most Nominated: <strong>${escapeHtml(topMember)}</strong> (${maxCount}/${quizQuestions.length} baar)
          </div>
        </div>

        <!-- Collapsible / Scrollable Answer Summary -->
        <div class="mb-5 text-left">
          <div class="text-xs font-bold uppercase tracking-wider text-amber-300 mb-2 flex items-center justify-between">
            <span>📋 Aapke Mazedaar Jawab:</span>
            <span class="text-amber-200/60 font-normal">Scroll to view all</span>
          </div>
          <div class="max-h-40 overflow-y-auto custom-scroll space-y-1.5 pr-1">
            ${summaryListHtml}
          </div>
        </div>

        <!-- Action Buttons: WhatsApp Viral Share & Play Again -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button
            onclick="shareOnWhatsApp()"
            class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-bold text-sm sm:text-base shadow-lg shadow-emerald-900/50 flex items-center justify-center gap-2 transition transform hover:-translate-y-0.5 cursor-pointer"
          >
            <span>📲</span>
            <span>Share on WhatsApp</span>
          </button>

          <button
            onclick="renderStartScreen()"
            class="cta-btn w-full py-3.5 px-4 rounded-2xl text-sm sm:text-base flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>🔄</span>
            <span>Play Again</span>
          </button>
        </div>
      `;

      animateCardSwap(html);
    }

    function shareOnWhatsApp() {
      playClickChime();
      const { topMember } = calculateTopPick();
      const profile = familyTitles[topMember] || familyTitles.Sab;
      const pageUrl = window.location.href;

      const shareText =
        `🪔 *DIWALI FAMILY FUN QUIZ 2026* 🎆\n\n` +
        `Maine abhi *${playerName}* ke naam se Diwali Family Quiz khela aur mujhe mila:\n` +
        `*${profile.badge}* 🏆\n\n` +
        `Ghar me sabse bada Mithai Chor kaun hai? 🍬 Ab tumhari baari hai! 👇\n` +
        `${pageUrl}`;

      const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* =========================================================================
       5. FLOATING AMBIENT LANTERNS & DIWALI EMOJIS
       ========================================================================= */
    function createFloatingLanterns() {
      const container = document.getElementById('lanternContainer');
      const items = ['🏮', '🪔', '✨', '🎇'];
      for (let i = 0; i < 12; i++) {
        const el = document.createElement('div');
        el.className = 'floating-lantern';
        el.textContent = items[i % items.length];
        el.style.left = `${Math.random() * 94}%`;
        el.style.fontSize = `${18 + Math.random() * 18}px`;
        el.style.animationDuration = `${12 + Math.random() * 14}s`;
        el.style.animationDelay = `${-Math.random() * 15}s`;
        container.appendChild(el);
      }
    }

    /* =========================================================================
       6. REALISTIC GRAND FINALE CANVAS FIREWORKS ANIMATION
       ========================================================================= */
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;
    let fireworksActive = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.5 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.018 + 0.012;
        this.gravity = 0.06;
        this.size = Math.random() * 2.5 + 1.5;
      }

      update() {
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function launchFireworkBurst() {
      const colors = ['#ffd700', '#ff6600', '#ff007f', '#00f0ff', '#adff2f', '#ffffff'];
      const x = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
      const y = Math.random() * (canvas.height * 0.45) + canvas.height * 0.1;
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 48; i++) {
        particles.push(new Particle(x, y, color));
      }
      playFireworkPop();
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      if (fireworksActive || particles.length > 0) {
        animationFrameId = requestAnimationFrame(animateFireworks);
      }
    }

    function startFireworks() {
      fireworksActive = true;
      resizeCanvas();
      launchFireworkBurst();
      setTimeout(launchFireworkBurst, 350);

      if (fireworkInterval) clearInterval(fireworkInterval);
      fireworkInterval = setInterval(() => {
        if (fireworksActive) {
          launchFireworkBurst();
        }
      }, 900);

      if (!animationFrameId) {
        animateFireworks();
      }
    }

    function stopFireworks() {
      fireworksActive = false;
      if (fireworkInterval) {
        clearInterval(fireworkInterval);
        fireworkInterval = null;
      }
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    // Initialize Application on Load
    window.onload = function () {
      resizeCanvas();
      createFloatingLanterns();
      renderStartScreen();
    };
  </script>
</body>
</html>
